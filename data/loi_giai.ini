; Cấu hình sinh lời giải (docs/loi_giai/sinh_loi_giai.py): câu nào lấy dữ liệu từ file nào trong thư mục data/.
; Sửa số liệu trong các file data (hoặc tham số ở đây) rồi chạy:
;     python docs/loi_giai/sinh_loi_giai.py          (chọn 1 = Markdown, 2 = TeX + PDF; Enter = mọi câu)
; File .txt là file trả lời của script tương ứng: mỗi dòng 1 câu trả lời, giống khi chạy
;     python interpolation/<script>.py data/<file>.txt
; ghi_chu: câu ghi chú về đề (LaTeX, công thức đặt trong $...$); để trống thì không in.
; Dòng bắt đầu bằng ; hoặc # là chú thích.

